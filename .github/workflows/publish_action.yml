name: Publish to Comfy registry
on:
  # Manual only. Do NOT publish on git tag push — tag/release is independent of
  # Registry; auto-publish on tags caused unauthorized/failed runs when the
  # owner ordered tag push alone (pyproject version may not match).
  workflow_dispatch:

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
